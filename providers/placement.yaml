# Which conditions a model is raced under on a race runner (engine/serve.py), by the name of the suite that
# sets them. A workflow test gives each attempt a hard budget, and an attempt that runs out of it ends as
# `over_budget`, which counts against the model. So a model is placed under the suite with the smallest budget
# per attempt it can finish a workflow test within: racing it under a smaller one would record a model that
# was cut off, not one that did the job badly.
#
#   small-tier   $0.12 an attempt (suites/small_tier.yaml)
#   mid-tier     $0.40 an attempt (suites/mid_tier.yaml)
#
# A runner uses a placement only for a suite it was started with (`--track`); a model placed under a suite the
# runner does not have is raced under its base suite, as before placements existed. A model not listed here is
# raced under the base suite. A pair is raced under the larger of its two models' budgets, so a small model
# can meet a mid-tier one on equal terms.
#
# How each was placed (2026-11-27):
#   recorded    its own attempts on the four workflow tests, standard level (the dearest is given)
#   estimated   never played here. The token use of the same provider's recorded mid-tier model on these tests
#               (input, the share read from the cache, output), at this model's own prices; twice that figure
#               must fit the budget, because a model's dearest attempt has cost up to twice its average.
# An estimate is not a result. Move a model when its own attempts say so.
#
# Not placed, so not offered for a race with a visitor's own key until they are:
#   anthropic claude-opus-4-8, claude-sonnet-4-6    no cache price listed in prices.yaml, so every read is
#                                                   counted at the full input price: about $0.70 and $0.42 an attempt
#   openai gpt-6-astra                              estimated $0.24 an attempt: twice that passes $0.40
#   google gemini-4-argon, -carbon, -neon           estimated $0.24 to $0.32 an attempt (Argon and Carbon at their
#                                                   price from 2026-12-01): twice that passes $0.40
#   google gemini-3.5-flash                         its price is unverified (prices.yaml)
#   google gemini-2.5-pro                           retired on 2026-11-30
#   openrouter: everything but the five below       hundreds of models; these five are the ones on record

