[project]
name = "gladiator"
version = "2.0.0a1"
description = "Head-to-head model evaluation: two models, one suite, identical settings."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=2.0",
    "openai>=3.0",
    "google-genai>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
gladiator = "gladiator:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "modules", "providers", "reports", "scorers"]
only-include = ["gladiator.py", "engine", "modules", "providers", "reports", "scorers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real model APIs and costs money (deselected unless GLADIATOR_LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"
# The v1 simulators are kept byte-for-byte (their SHA-256 pins depend on it): never lint or reformat them.
extend-exclude = ["simulators"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# These add the repo root to sys.path before importing, so `python gladiator.py` works without installing.
"gladiator.py" = ["E402"]
"tests/*" = ["E402"]
