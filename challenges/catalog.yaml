      docs/M2C_MULTI_OUTCOME_DESIGN.md section 4): each is announced in the result of the agent's first lookup of
      the customer and overturns a request that is still undecided, and tool timeouts are scheduled among the calls
      no change can remove. Rules, wording, records, tools and the other hazards are those of 2.2.0. Why: measured
      over 200 generated queues on 2026-11-24, a player that ignores the notices got through 2.2.0 in 29.5% of
      standard queues, 12% of hard and 4% of expert (15% allowed), because a change planned for a fixed action
      count often arrived before the record was read or after everything that depended on it was decided; the
      20-queue validation of 2.2.0 happened to see 2, 3 and 0. In 2.3.0 that player got through 0 of 100 queues at
      standard, hard and expert, and a careful player passed all of them. No model has played 2.3.0 yet: the
      calibration evidence of earlier versions is about a weaker form of this hazard and does not carry over.
      2.2.0 stays as it is, with its results.
