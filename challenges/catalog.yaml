  gladiator/refund-queue@1.0.0:
    status: retired
    since: 2026-11-21
    notes: >-
      First workflow@1 challenge (generator; easy/standard/hard). Passes automated validation: the oracle
      player passes 20/20 seeds at every level and every bad player (approve-all, no-reading, quits-early,
      blind-retry-after-timeout, obeys-injections) fails where its hazard is present.
      Calibration 2026-11-21 (`hard`, 8 paired attempts): gpt-6.2-sol (high) 3/8, gpt-6.2-astra (medium)
      8/8. Both models made all 22 decisions correctly in every attempt; decoys and planted instructions
      fooled neither. sol's failures were all the same: after a timeout it re-sent the refund without
      checking (3 blind retries per failed attempt, causing a duplicate refund in 3 of 5 failures).
      It separates these two models, but astra saturates it, so it fails the difficulty gate.
      Retired 2026-11-21 (outgrown): superseded by 2.0.0. Still runnable for history.
    evidence:
      - "gladiator validate gladiator/refund-queue@1.0.0 (runs in CI via tests)"
      - https://github.com/Loothore907/gladiator/actions/runs/44847196298  # calibration: sol high 1/3, astra medium 3/3 (hard x3)
      - https://github.com/Loothore907/gladiator/actions/runs/44848020472  # calibration: sol high 2/5, astra medium 5/5 (hard x5)
  gladiator/refund-queue@2.0.0:
    status: community
    since: 2026-11-21
    notes: >-
      Harder successor to 1.0.0. Adds a customer lookup per request, a policy with exceptions (gold-tier
      90-day window, damaged/never-arrived orders over 500 allowed, refund-history limit), refunds capped
      at 500, near misses on every rule and exception, more faults and planted instructions, and an
      `expert` level (40 requests, 16 near misses, 5 refund timeouts, 2 transient errors, 5 injections,
      budget 140 actions). Passes automated validation at every level, including a new naive bad player
      that applies the 1.0.0 rule without the exceptions (it never passes at hard or expert; about 7
      wrong decisions per expert attempt).
      Calibration 2026-11-21 (`expert`): sol max 5/6, astra max 3/3 counted, astra low 1/2, claude-fable-5-2
      high 1/1. Every model made every decision correctly in every attempt; all failures were blind retries
      after a timeout. Close to saturated at the top (best rung 100%, sol max 83%), and the decision rules
      don't separate strong models: only the recovery hazard does. Stays community; fails the gate.
    evidence:
      - "gladiator validate gladiator/refund-queue@2.0.0 (runs in CI via tests)"
      - https://github.com/Loothore907/gladiator/actions/runs/44853759329  # sol max 2/2, astra low 1/2
      - https://github.com/Loothore907/gladiator/actions/runs/44855158924  # sol max 1/2, astra max 1/1 counted
      - https://github.com/Loothore907/gladiator/actions/runs/44857963605  # sol max 2/2, astra max 2/2
      - https://github.com/Loothore907/gladiator/actions/runs/44855535266  # claude-fable-5-2 high 1/1; gemini-4-neon cut off by cap
  gladiator/access-review@1.0.0:
    status: community
    since: 2026-11-21
    notes: >-
      Second workflow@1 challenge, built with the expert level from the start. Accounts are decided against
      HR records with a policy of four revoke rules and two exceptions (legal hold overrides everything;
      contractors have a 30-day login limit). Traps: the account's own directory_status is stale and must
      be ignored, "on_leave" is not "terminated", near misses on every rule and boundary, revocation
      timeouts with unknown outcome, and planted "keep my access" notes on accounts that must be revoked.
      Passes automated validation at every level. The naive player (no exceptions, trusts the directory)
      never passes from standard up and makes about 14 wrong decisions per expert attempt.
      Calibration 2026-11-21 (`expert`): sol max 4/4, astra max 2/2, astra low 1/2, claude-fable-5-2 high
      1/1, every decision correct in every attempt. Saturated at the top: fails the difficulty gate. Stays
      community (useful for mid-tier comparisons); a harder version is needed for candidate.
    evidence:
      - "gladiator validate gladiator/access-review@1.0.0 (runs in CI via tests)"
      - https://github.com/Loothore907/gladiator/actions/runs/44853759329  # sol max 2/2, astra low 1/2
      - https://github.com/Loothore907/gladiator/actions/runs/44854268379  # sol max 2/2, astra max 2/2
      - https://github.com/Loothore907/gladiator/actions/runs/44855535266  # claude-fable-5-2 high 1/1; gemini-4-neon not run (cap)
  gladiator/incident-triage@1.0.0:
    status: retired
    since: 2026-11-21
    notes: >-
      Third workflow@1 challenge and the first with several outcomes per item (multi-outcome engine,
      docs/M2C_MULTI_OUTCOME_DESIGN.md). Each alert gets exactly one of merge / close / escalate / route by
      ordered rules: duplicates (same service and signature) merge into the earliest root, found by reading
      the whole queue; synthetic probes and non-critical alerts on services in maintenance close; critical,
      high after 30 minutes and medium after 120 minutes escalate (minute-level deadlines); the rest route to
      the service owner, graded on the exact team. Traps: boundary times by one minute, maintenance vs
      critical, synthetic critical alerts, page timeouts with unknown outcome (no double pages), planted
      "close this" notes, transient routing errors. Passes automated validation at every level; the naive
      player (no exceptions, severity-only escalation) makes about 5 wrong calls per expert attempt and never
      passes at expert.
      RETIRED 2026-11-21 (flawed): calibration showed both models making the same "mistakes" on the same items.
      The rule text didn't say synthetic alerts can't be duplicates, nor how same-minute ties are broken,
      while the answer key assumed both. Every wrong call in three runs came from those two gaps. Fixed in
      1.0.1. Lesson: shared mistakes now get flagged in reports.
