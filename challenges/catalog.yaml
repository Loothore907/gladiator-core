  gladiator/inventory-transfer@1.0.0:
    status: retired
    since: 2026-11-21
    notes: >-
      Fourth workflow@1 challenge and the first with coupled decisions (shared resources,
      docs/M2C_MULTI_OUTCOME_DESIGN.md section 3). Orders are processed in a stated order (gold customers,
      then priority, then age); each ships whole from the home warehouse if it has stock, else from the
      fallback warehouse with the most stock (alphabetical on ties; standard-tier orders over 2 units may not
      use a fallback), else is backordered. Every shipment uses stock, so an early mistake changes what is
      right later. Ground truth comes from a deterministic allocator. Traps: planted shortages in the home
      warehouse, the per-tier exception, demand skewed to one sku, shipment timeouts with unknown outcome
      (no double shipments), planted "ship this first" notes. Passes automated validation at every level,
      including two bad players that must fail: naive (no exception) and unordered (ignores the stated
      processing order).
      Calibration 2026-11-21 (`expert`): sol max 4/4, astra max 2/2, astra low 0/2 (blind retries; a duplicate
      shipment cascaded into 2 wrong decisions). Saturated at the top. RETIRED 2026-11-21: the rule text left
      same-minute placed_at ties open (no calibration item hit it, but it could); fixed in 1.0.1.
    evidence:
      - "gladiator validate gladiator/inventory-transfer@1.0.0 (runs in CI via tests)"
      - https://github.com/Loothore907/gladiator/actions/runs/44877738018  # sol max 2/2, astra max 2/2
      - https://github.com/Loothore907/gladiator/actions/runs/44877739880  # sol max 2/2, astra low 0/2
