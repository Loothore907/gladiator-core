version: 1.1.0
name: Job queue recovery
description: Finish a job queue after an interrupted run. Some jobs were already applied (receipts exist but the
  queue still says pending) and the run checkpoint is stale; new priority jobs are added to the front of the queue
  mid-task; an account is suspended mid-task; applying times out ambiguously. The rule is simple; the test is recovering
  cleanly, without applying anything twice or missing added jobs.
  Adds equivalent rewordings of the brief and policy, one picked per attempt (so wording alone cannot decide a result).
