suite: expert-refund
version: 1
description: >
  One workflow challenge (refund-queue 2.1.0) at its top level, for calibration runs that need a whole
  budget for one test (long expert attempts at high reasoning effort). Fresh world per attempt,
  identical for both contestants.

defaults:
  max_output_tokens: 8192   # includes reasoning/thinking tokens
  effort: medium
  timeout_s: 300
  difficulty: expert

success:
  primary: outcome
  profile: balanced          # balanced | budget | latency (scorers/efficiency.py)
  tiebreak: [task_correct, workflow_correct, cost_usd, wall_s]

nodes:
  - id: refund-queue
    challenge: gladiator/refund-queue@2.2.0
